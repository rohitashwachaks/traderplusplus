[pytest]
# Pytest configuration for Trader++ test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 6.0

# Add current directory to Python path
pythonpath = .

# Test output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Custom markers
markers =
    integration: marks tests as integration tests (may require API credentials)
    live: marks tests that interact with live trading (requires explicit opt-in)
    slow: marks tests as slow running
    unit: marks tests as unit tests (no external dependencies)

# Test paths
testpaths = tests

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=. --cov-report=html --cov-report=term

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (if using pytest-timeout)
# timeout = 300
