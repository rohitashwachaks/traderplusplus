[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traderplusplus"
version = "0.1.0"
description = "Trader++ is a modular, realistic, and hackable trading engine for strategy backtesting and portfolio simulation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Rohitashwa Chakraborty", email = "rohitashwachaks@gmail.com"},
]
keywords = ["quant", "trading", "backtesting", "portfolio", "simulation", "finance"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
  "pandas>=2.2",
  "numpy>=1.23,<2",
  "matplotlib>=3.4",
  "yfinance>=0.2.40",
  "requests",
  "python-dotenv",
  "bt>=1.1",
  "quantstats>=0.0.80",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "ipykernel"]

[project.urls]
Homepage = "https://github.com/yourusername/traderplusplus"
Documentation = "https://github.com/yourusername/traderplusplus/wiki"
Source = "https://github.com/yourusername/traderplusplus"
Issues = "https://github.com/yourusername/traderplusplus/issues"